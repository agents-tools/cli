name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: agents-tools/.github/.github/workflows/swift-package-ci.yml@301c132794cbee950bfca6ba83987975d1ea6917
    with:
      runner: macos-26
      package-directory: .
      format-configuration: .swift-format

  smoke:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Release Build
        run: swift build -c release

      - name: Executable Smoke Checks
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          executable = pathlib.Path('.build/release/agents').resolve()
          source = pathlib.Path('Sources/CLI/EntryPoint.swift').read_text()
          version = re.search(r'static let version = "([^"]+)"', source).group(1)
          with tempfile.TemporaryDirectory(prefix='agents-smoke-') as root:
              env = {
                  'HOME': root,
                  'TMPDIR': root,
                  'PATH': '/usr/bin:/bin:/usr/sbin:/sbin',
                  'GIT_CONFIG_NOSYSTEM': '1',
                  'GIT_CONFIG_GLOBAL': '/dev/null',
                  'GIT_TERMINAL_PROMPT': '0',
              }
              for arguments in [['--help'], ['skills', '--help']]:
                  result = subprocess.run([str(executable), *arguments], cwd=root, env=env,
                                          capture_output=True, text=True, check=True)
                  assert 'USAGE:' in result.stdout and not result.stderr, result
                  print(result.stdout)
              result = subprocess.run([str(executable), '--version'], cwd=root, env=env,
                                      capture_output=True, text=True, check=True)
              assert result.stdout == f'agents {version}\n' and not result.stderr, result
              print(result.stdout)
              for arguments in [['unknown'], ['skills', 'unknown'], ['help', 'unknown']]:
                  result = subprocess.run([str(executable), *arguments], cwd=root, env=env,
                                          capture_output=True, text=True)
                  assert result.returncode == 64 and not result.stdout, result
                  assert result.stderr.startswith('Error:'), result
                  print(result.stderr)
          PY

  presentation:
    uses: agents-tools/.github/.github/workflows/presentation.yml@301c132794cbee950bfca6ba83987975d1ea6917
    with:
      record: Documentation/Assets/Demo/record.json
      recipe: Documentation/Assets/Demo/recipe.json
      output-directory: Documentation/Assets/Demo
